---
name: renovate

# Needs a GitHub App installed on this repository, with repository permissions
# Contents, Pull requests, Issues, Workflows, Checks and Commit statuses
# (read and write) and Administration, Dependabot alerts and Metadata (read).
# Its client ID is the RENOVATE_APP_CLIENT_ID variable and its private key the
# RENOVATE_APP_PRIVATE_KEY secret.

"on":
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Renovate acts through the GitHub App's token, not GITHUB_TOKEN: pull requests
# opened with GITHUB_TOKEN need their CI approved by hand, and GITHUB_TOKEN
# cannot be granted the `workflows` permission that updating these files needs.
permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084  # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Exact, so a run is reproducible; Renovate bumps this pin itself.
          renovate-version: 44.239.1
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Commits go through the API, so GitHub signs them as the App. The
          # default already does this for an App token; stated so it cannot
          # silently change.
          RENOVATE_PLATFORM_COMMIT: enabled
