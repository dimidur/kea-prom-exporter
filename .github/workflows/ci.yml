name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a newly-published advisory against unchanged code is still
  # caught. Most of what govulncheck finds arrives without anyone touching
  # this repository.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  # Callable so the release workflow can require these gates against the
  # exact tagged tree before anything is published.
  workflow_call:

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: `@v4` is mutable and its owner
# can repoint it at any commit, so a tag is a version constraint rather than a
# pin. The trailing comment records the release each SHA corresponds to, which
# is also what Dependabot reads when it bumps them.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version from go.mod so a toolchain bump happens in one
          # place. Pinning it here separately is how CI ended up unable to
          # build its own module.
          go-version-file: go.mod
          cache: true

      - name: go mod tidy (verify dependencies are clean)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Formatting was not checked before, which is how unformatted code
      # reached main. `gofmt -l` prints offending files but still exits 0,
      # so the output has to be tested explicitly.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # Pinned rather than @latest: an unpinned tool turns main red without a
      # code change, and re-running an old commit's CI no longer reproduces
      # what that commit passed. Dependabot does not track `go run pkg@ver` in
      # a workflow, so these are bumped by hand -- a `go.mod` tool directive
      # would automate it at the cost of ~50 indirect deps in a single-file
      # binary's module graph.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      # -race matters specifically here: Prometheus calls Collect
      # concurrently when scrapes overlap, which is exactly where a race in
      # this exporter lives (and did).
      - name: test
        run: go test -race -v ./...

      - name: build (host arch)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/kea-prom-exporter .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet ./...

  docker:
    runs-on: ubuntu-latest
    # Both gates: building and scanning an image whose dependencies just
    # failed an audit wastes minutes and shows a green docker job beside a
    # red security one.
    needs: [test, security]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: build multi-arch image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kea-prom-exporter:ci

      # Load a single-arch copy so the scanner has something to inspect;
      # the multi-arch build above stays in the buildx cache only.
      - name: build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: kea-prom-exporter:scan

      # Trivy rather than Docker Scout: it needs no registry credentials, so
      # this gate also runs on pull requests from forks.
      - name: scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kea-prom-exporter:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
