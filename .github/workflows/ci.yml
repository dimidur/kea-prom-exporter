---
name: ci

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a newly-published advisory against unchanged code is still
  # caught. Most of what govulncheck finds arrives without anyone touching
  # this repository.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  # Callable so the release workflow can require these gates against the
  # exact tagged tree before anything is published.
  workflow_call:

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: `@v4` is mutable and its owner
# can repoint it at any commit, so a tag is a version constraint rather than a
# pin. The trailing comment records the release each SHA corresponds to, which
# is also what Renovate reads when it bumps them.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A push to main here, not on a fork: the only runs that raise the
      # floors and publish the coverage badge.
      MAIN_PUSH: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
        && github.repository == 'dimidur/kea-prom-exporter' }}
    outputs:
      floors-changed: ${{ steps.raise.outputs.changed }}
      coverage: ${{ steps.measure.outputs.coverage }}
    steps:
      # No token left in the checkout: this job runs the dependencies' code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          # go.mod's `go` line is the only place the Go version is set; CI
          # never pins one of its own.
          go-version-file: go.mod
          cache: true

      - name: go mod tidy (verify dependencies are clean)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # `gofmt -l` prints offending files but still exits 0, so the output has
      # to be tested explicitly.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # The compat tag adds the compatibility check and excludes nothing, so
      # this one run vets every file, including the check only compat.yml
      # runs.
      - name: vet
        run: go vet -tags compat ./...

      # Pinned rather than @latest: an unpinned tool turns main red without a
      # code change, and re-running an old commit's CI no longer reproduces
      # what that commit passed. Running a tool at a version keeps it out of
      # the exporter's own module graph; Renovate bumps each
      # `go run <module>/cmd/...@vX.Y.Z` pin through the custom manager in
      # .github/renovate.json.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags compat ./...

      # -race matters specifically here: Prometheus calls Collect
      # concurrently when scrapes overlap, which is exactly where a race in
      # this exporter would live.
      - name: test
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: coverage ratchet
        run: scripts/coverage-ratchet.sh check --reuse

      - name: build (host arch)
        run: >-
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w"
          -o /tmp/kea-prom-exporter .

      # Last, so only a green job on main raises the floors. The changed
      # baseline goes to raise-floors, which commits it.
      - name: raise the coverage floors
        id: raise
        if: env.MAIN_PUSH == 'true'
        run: scripts/coverage-ratchet.sh bump --reuse >> "$GITHUB_OUTPUT"
      - if: steps.raise.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-baseline
          path: coverage-baseline.json
          retention-days: 1
      # The measured total, for the README badge that coverage-badge
      # publishes.
      - name: measure the total coverage
        id: measure
        if: env.MAIN_PUSH == 'true'
        run: |
          coverage=$(scripts/coverage-ratchet.sh total --reuse)
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

  # The coverage bot commits the raised floors to main. Why it does so from a
  # job of its own: docs/design.md, "Coverage is held to a ratchet".
  raise-floors:
    needs: test
    if: needs.test.outputs.floors-changed == 'true'
    runs-on: ubuntu-latest
    # Nothing here uses the workflow's token: the artifact comes from this run,
    # and the commit is made with the bot's.
    permissions: {}
    # The bot's key is a secret of this environment, which only main may use.
    environment: coverage-bot
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-baseline
          path: ${{ runner.temp }}/floors
      - id: coverage-bot
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ secrets.COVERAGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COVERAGE_BOT_PRIVATE_KEY }}
          permission-contents: write
      # The commit is made on top of the commit the floors were measured on,
      # and GitHub refuses it if main has moved on since.
      - name: commit the raised floors
        env:
          GH_TOKEN: ${{ steps.coverage-bot.outputs.token }}
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" --arg measured "$GITHUB_SHA" \
            --rawfile floors "$RUNNER_TEMP/floors/coverage-baseline.json" '
            { query: ("mutation($input: CreateCommitOnBranchInput!) {"
                      + " createCommitOnBranch(input: $input) { commit { oid } } }"),
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                expectedHeadOid: $measured,
                message: { headline: "ci: raise the coverage floors [skip ci]" },
                fileChanges: { additions: [
                  { path: "coverage-baseline.json", contents: ($floors | @base64) } ] } } } }
          ' > "$RUNNER_TEMP/commit.json"
          if gh api graphql --input "$RUNNER_TEMP/commit.json" \
            --jq '.data.createCommitOnBranch.commit.oid'; then
            exit 0
          fi
          landed=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$landed" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on during this run; its next run raises the floors"
            exit 0
          fi
          echo "::error::main rejected the coverage bot's commit of the raised floors"
          exit 1

  # Publishes main's measured coverage for the README badge, as a shields.io
  # endpoint file on GitHub Pages. Why there: docs/design.md, "Coverage is
  # held to a ratchet".
  coverage-badge:
    needs: test
    if: needs.test.outputs.coverage != ''
    runs-on: ubuntu-latest
    # A backstop only: the deploy attempts below are bounded on their own, so a
    # failed deploy ends this job as failed well before it, not as cancelled.
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.published.outputs.url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Two merges close together can finish out of order, and the older one
      # must not overwrite the newer badge. main being ahead only by the
      # coverage bot's commits still counts as this run's commit.
      - name: check this is main's newest measured commit
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq '
            [.commits[] | select((.author.login // "") != "dimidur-coverage-bot[bot]")]
            | length')
          if [ "$others" = 0 ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved on; the run for its newest commit publishes the badge"
          fi
      - name: write the badge
        if: steps.newest.outputs.newest == 'true'
        env:
          COVERAGE: ${{ needs.test.outputs.coverage }}
        run: |
          mkdir "$RUNNER_TEMP/site"
          jq -n --argjson coverage "$COVERAGE" '
            { schemaVersion: 1, label: "coverage", message: "\($coverage)%",
              color: (if $coverage >= 90 then "brightgreen"
                      elif $coverage >= 75 then "yellow" else "red" end) }
          ' > "$RUNNER_TEMP/site/coverage.json"
      - if: steps.newest.outputs.newest == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      # deploy-pages looks the artifact up once, and right after an upload that
      # lookup can come back empty (actions/deploy-pages#451). Only the deploy
      # is retried: the artifact can be uploaded only once, and a re-run's
      # upload makes the lookup find two. When the first two attempts fail at
      # the lookup, the third starts about 80 s after the first, past the
      # longest lag measured there (about 46 s) and the 60 s wait reported to
      # clear it. Remove the retries only once deploy-pages itself waits at
      # least 60 s for the artifact, or accepts the uploaded artifact's ID
      # instead of looking it up by name.
      #
      # Each attempt is bounded twice. The action's own timeout counts only
      # from the deployment's creation and is checked between status polls,
      # so a 60 s timeout gives up by about 96 s and cancels its deployment.
      # The step's 2-minute limit bounds the rest, the lookup and a hung
      # request included, and fails the step rather than cancelling the job.
      - name: deploy the badge (attempt 1 of 3)
        id: deploy
        if: steps.newest.outputs.newest == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          timeout: 60000
      - name: wait before attempt 2
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - name: deploy the badge (attempt 2 of 3)
        id: deploy-2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          timeout: 60000
      - name: wait before attempt 3
        if: steps.deploy-2.outcome == 'failure'
        run: sleep 60
      - name: deploy the badge (attempt 3 of 3)
        id: deploy-3
        if: steps.deploy-2.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          timeout: 60000
      - name: link the published badge
        id: published
        if: steps.newest.outputs.newest == 'true'
        env:
          PAGE_URL: >-
            ${{ steps.deploy.outputs.page_url || steps.deploy-2.outputs.page_url
            || steps.deploy-3.outputs.page_url }}
        run: echo "url=${PAGE_URL}coverage.json" >> "$GITHUB_OUTPUT"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7  # v25.1.0

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: install yamllint
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install --require-hashes \
            --only-binary :all: -r .github/yamllint-requirements.txt
      # --strict also fails on warnings: the default config reports some
      # rules, such as truthy and document-start, as warnings, which otherwise
      # exit 0.
      - name: yamllint
        run: '"$RUNNER_TEMP/yamllint/bin/yamllint" --strict .'

  # Workflows and shell scripts. actionlint runs shellcheck on every
  # workflow's inline scripts, so both use the one pinned below.
  workflows-and-scripts:
    runs-on: ubuntu-latest
    env:
      # The release file for linux.x86_64, pinned by its SHA-256.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      # No Go cache: it would share test's key and could be saved from this
      # job, which builds actionlint only.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The runner's own shellcheck changes with the runner image.
      - name: install shellcheck
        run: |
          asset="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$asset"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - name: actionlint
        run: |
          shellcheck --version
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      # Every tracked shell file, the tests' .bash and .bats included, with
      # all optional checks on and the files each sources followed.
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash' '*.bats')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no shell scripts found to check"
            exit 1
          fi
          shellcheck --enable=all -x "${scripts[@]}"
      - name: script tests
        run: scripts/test-scripts.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # A cache key of its own: setup-go keys the cache on the hash of these
      # files alone, and test's default, go.sum, would give both jobs one
      # cache, saved by whichever finished first.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet ./...

  docker:
    runs-on: ubuntu-latest
    # Both gates: building and scanning an image whose dependencies just
    # failed an audit wastes minutes and shows a green docker job beside a
    # red security one.
    needs: [test, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: build multi-arch image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kea-prom-exporter:ci

      # Load a single-arch copy so the scanner has something to inspect;
      # the multi-arch build above stays in the buildx cache only.
      - name: build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: kea-prom-exporter:scan

      # The Dockerfile compiles with go.mod's version through GOTOOLCHAIN;
      # this checks the image binary actually carries it.
      - name: image Go matches go.mod
        run: |
          want="go$(awk '$1 == "go" {print $2}' go.mod)"
          got=$(docker run --rm kea-prom-exporter:scan --version)
          echo "$got"
          case "$got" in
            *", $want)") ;;
            *)
              msg="image binary was not built with $want from go.mod"
              echo "::error file=Dockerfile::$msg"
              exit 1
              ;;
          esac

      # The unit tests reach the process only through fakes, so this is where
      # the real listener, signal handling and runtime collectors are run.
      # Nothing listens on KEA_URL, so the scrape must still answer, with
      # kea_up 0, and a SIGTERM must end the container with exit 0.
      - name: image serves /metrics and stops cleanly
        run: |
          docker run -d --name smoke -p 127.0.0.1:9547:9547 \
            -e KEA_URL=http://127.0.0.1:1/ -e KEA_TIMEOUT=1s \
            kea-prom-exporter:scan
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for _ in $(seq 30); do
            if metrics=$(curl -fsS http://127.0.0.1:9547/metrics); then
              break
            fi
            sleep 1
          done
          if [ -z "${metrics:-}" ]; then
            echo "::error file=Dockerfile::/metrics did not answer within 30s"
            exit 1
          fi
          for want in '^kea_up 0$' '^go_goroutines ' '^process_start_time_seconds '; do
            if ! grep -q "$want" <<<"$metrics"; then
              echo "::error file=Dockerfile::/metrics has no line matching $want"
              exit 1
            fi
          done
          docker stop -t 10 smoke
          code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
          if [ "$code" != 0 ]; then
            echo "::error file=Dockerfile::container exited $code on SIGTERM, want 0"
            exit 1
          fi

      # Trivy rather than Docker Scout: it needs no registry credentials, so
      # this gate also runs on pull requests from forks.
      - name: scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: kea-prom-exporter:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
