name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A tag push previously published straight away, running no checks at all:
  # tagging a broken commit, or tagging while main was red, shipped it. The
  # full gate suite now runs against the tagged tree first.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # This job is the one with Docker Hub credentials in scope, so the SHA pins
  # below matter most here.
  publish:
    needs: verify
    # Tags only. On a workflow_dispatch the semver patterns do not match, so
    # metadata-action emits an empty (or "latest") version and the image would
    # claim a build identity it does not have.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kea-prom-exporter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # So kea_exporter_build_info and --version report the tag and commit
          # this image was actually built from.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # arm64 included so this can run on the Pi hosting the Kea peer it
          # watches, not only on an amd64 box.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
