---
name: release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Every gate in ci.yml runs against the tagged tree before anything is
  # published. The called workflow's coverage-badge job needs pages and
  # id-token write to be granted here, but it runs only on a push to main,
  # never on a release.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # The tagged tree against the Kea it pins (docs/design.md, "Compatibility is
  # checked against a real Kea"). The called workflow's issue job needs
  # issues: write to be granted here, but it runs only on a Renovate pull
  # request, never on a release.
  compat:
    uses: ./.github/workflows/compat.yml
    permissions:
      contents: read
      issues: write

  # This job is the one with Docker Hub credentials in scope, so the SHA pins
  # below matter most here.
  publish:
    needs: [verify, compat]
    # Tags only. On a workflow_dispatch the semver patterns do not match, so
    # metadata-action emits an empty version and the image would claim a build
    # identity it does not have.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: dimidur/kea-prom-exporter
          # latest=auto puts `latest` on a stable semver tag and withholds it
          # from a prerelease, which also gets no minor-line tag. Stated rather
          # than left to the default, so an update of the action cannot change
          # it silently.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          # So kea_exporter_build_info and --version report the tag and commit
          # this image was actually built from.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # arm64 included so the exporter can run beside Kea on an arm64 host
          # such as a Raspberry Pi, not only on an amd64 box.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Notes come from GitHub's own generator, sorted by the pull request labels
  # listed in .github/release.yml. Runs after publish, so a release is only
  # announced once its images are on Docker Hub.
  notes:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # gh release edit cannot regenerate notes, and rewriting a release
          # would discard edits made by hand, so a re-run leaves it alone.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "release $TAG already exists; leaving it as it is"
            exit 0
          fi
          # --verify-tag: without it, a missing tag is created silently from
          # the default branch.
          flags=(--generate-notes --verify-tag)
          # A tag with a suffix (v1.2.0-rc1) must not take the Latest badge.
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$REPO" "${flags[@]}"
