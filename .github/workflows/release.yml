---
name: release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Every gate in ci.yml runs against the tagged tree before anything is
  # published. The called workflow's coverage-badge job needs pages and
  # id-token write to be granted here, but it runs only on a push to main,
  # never on a release.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # The tagged tree against the Kea it pins (docs/design.md, "Compatibility is
  # checked against a real Kea"). The called workflow's issue job needs
  # issues: write to be granted here, but it runs only on a Renovate pull
  # request, never on a release.
  compat:
    uses: ./.github/workflows/compat.yml
    permissions:
      contents: read
      issues: write

  # This job and overview hold Docker Hub credentials, so the SHA pins in them
  # matter most. Each job that moves something naming the latest release
  # classifies the tag itself: docs/design.md, "Only the highest release
  # names the latest".
  publish:
    needs: [verify, compat]
    # Tags only. Run on a branch, the semver patterns do not match, so
    # metadata-action emits an empty version and the image would claim a build
    # identity it does not have.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The Docker Hub tokens are secrets of this environment, which only v* tags
    # may use; a tag ruleset limits who can create those.
    environment: dockerhub
    permissions:
      contents: read
    # Whether the tag is stable is fixed with the tag, so overview can take
    # it from here; what it may move is decided where it is moved.
    outputs:
      stable: ${{ steps.classify.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      # Stable only, which reads nothing: what the tag may move is decided by
      # tag-image, after the build.
      - id: classify
        uses: ./.github/actions/classify-release
        with:
          stable-only: "true"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: dimidur/kea-prom-exporter
          # The version tag only: `latest` and the minor-line tag are moved
          # after the push, by tag-image.
          flavor: latest=false
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          # So kea_exporter_build_info and --version report the tag and commit
          # this image was actually built from.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # arm64 included so the exporter can run beside Kea on an arm64 host
          # such as a Raspberry Pi, not only on an amd64 box.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: move latest and the minor line's tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/tag-image.sh dimidur/kea-prom-exporter "$TAG"

  # The Docker Hub overview is the README of the tag just published, with
  # relative links made absolute to that tag. A job of its own, so a failure
  # here neither holds back the release notes nor needs the images rebuilt to
  # retry. Its own token, because the description API needs the delete scope,
  # which pushing does not.
  overview:
    needs: publish
    # A prerelease never moves the overview, so it does not enter the
    # environment at all.
    if: needs.publish.outputs.stable == 'true'
    runs-on: ubuntu-latest
    # The Docker Hub tokens are secrets of this environment, which only v* tags
    # may use; a tag ruleset limits who can create those.
    environment: dockerhub
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - id: classify
        uses: ./.github/actions/classify-release

      # Hub keeps one overview per repository, and it describes `latest`.
      - if: steps.classify.outputs.highest == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          # Docker Hub's limit is 100 bytes, which the GitHub description exceeds.
          short-description: >-
            Prometheus exporter for ISC Kea DHCP 3.x: lease pools, packet
            counters and HA peer state.
          enable-url-completion: true

  # The GitHub release (scripts/create-release.sh). Runs after publish, so a
  # release is only announced once its images are on Docker Hub.
  notes:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - id: classify
        uses: ./.github/actions/classify-release
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          STABLE: ${{ steps.classify.outputs.stable }}
          HIGHEST: ${{ steps.classify.outputs.highest }}
        run: scripts/create-release.sh "$TAG" "$STABLE" "$HIGHEST"
